services:
  postgres:
    extends:
      file: docker-compose.v14-integration.yml
      service: postgres

  portfolio-risk-service:
    extends:
      file: docker-compose.v14-integration.yml
      service: portfolio-risk-service

  decision-governance-service:
    build:
      context: ../..
      dockerfile: services/decision-governance-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3007
      STOCKQUANT_DATABASE_URL: postgresql://decision_governance:${STOCKQUANT_DATABASE_PASSWORD_DECISION_GOVERNANCE:?isolated password required}@postgres:5432/decision_governance
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: ${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:?isolated token required}
      STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION: ${STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION:?isolated token required}
      STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY: ${STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY:?isolated token required}
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3007/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [integration]

  trade-execution-service:
    build:
      context: ../..
      dockerfile: services/trade-execution-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3005
      STOCKQUANT_DATABASE_URL: postgresql://trade_execution:${STOCKQUANT_DATABASE_PASSWORD_TRADE_EXECUTION:?isolated password required}@postgres:5432/trade_execution
      STOCKQUANT_PORTFOLIO_API_URL: http://portfolio-risk-service:3001
      STOCKQUANT_GOVERNANCE_URL: http://decision-governance-service:3007
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: ${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:?isolated token required}
      STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION: ${STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION:?isolated token required}
      STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY: ${STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY:?isolated token required}
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
      STOCKQUANT_V13_TEST_FAULTS_ENABLED: ${STOCKQUANT_V13_TEST_FAULTS_ENABLED:-false}
      STOCKQUANT_V15_TEST_PAUSE_AFTER_AUTHORIZATION_DELAY_MS: ${STOCKQUANT_V15_TEST_PAUSE_AFTER_AUTHORIZATION_DELAY_MS:-0}
      STOCKQUANT_V15_TEST_AUTO_COMMIT_RESTART_DELAY_MS: ${STOCKQUANT_V15_TEST_AUTO_COMMIT_RESTART_DELAY_MS:-0}
    depends_on:
      postgres:
        condition: service_healthy
      portfolio-risk-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3005/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [integration]

  quant-research-service:
    extends:
      file: docker-compose.v14-integration.yml
      service: quant-research-service

  platform-api-service:
    extends:
      file: docker-compose.v14-integration.yml
      service: platform-api-service
    restart: unless-stopped
    environment:
      STOCKQUANT_NATS_URL: nats://nats:4222
      STOCKQUANT_ARTIFACT_CONTENT_ROOT: /var/lib/stockquant/research-artifacts
      STOCKQUANT_NATS_DURABLE: ${STOCKQUANT_NATS_DURABLE:-stockquant-v15-temporal-dispatch}
      STOCKQUANT_NATS_DELIVER_SUBJECT: ${STOCKQUANT_NATS_DELIVER_SUBJECT:-stockquant.v1.5.dispatch.platform}
      STOCKQUANT_TEMPORAL_ADDRESS: temporal:7233
      STOCKQUANT_TRADE_EXECUTION_URL: http://trade-execution-service:3005
      STOCKQUANT_GOVERNANCE_URL: http://decision-governance-service:3007
      STOCKQUANT_V14_TEST_HOOKS_ENABLED: "false"
      STOCKQUANT_V14_TEST_DELAY_MS: "0"
      STOCKQUANT_V14_TEST_AFTER_QUANT_DELAY_MS: "0"
      STOCKQUANT_V15_DISPATCH_TEST_DELAY_MS: ${STOCKQUANT_V15_DISPATCH_TEST_DELAY_MS:-0}
      STOCKQUANT_V15_TEST_ACK_WAIT_MS: ${STOCKQUANT_V15_TEST_ACK_WAIT_MS:-30000}
      STOCKQUANT_V15_TEST_DROP_ACK_ONCE: ${STOCKQUANT_V15_TEST_DROP_ACK_ONCE:-false}
      STOCKQUANT_V15_TEST_TEMPORAL_FAILURE_ONCE: ${STOCKQUANT_V15_TEST_TEMPORAL_FAILURE_ONCE:-false}
      STOCKQUANT_V15_TEST_DATABASE_FAILURE_ONCE: ${STOCKQUANT_V15_TEST_DATABASE_FAILURE_ONCE:-false}
      STOCKQUANT_V15_TEST_PRELOOKUP_DELAY_MS: ${STOCKQUANT_V15_TEST_PRELOOKUP_DELAY_MS:-0}
      STOCKQUANT_V15_TEST_ACTIVITY_DELAY_MS: ${STOCKQUANT_V15_TEST_ACTIVITY_DELAY_MS:-0}
    volumes:
      - research-artifacts-v1:/var/lib/stockquant/research-artifacts
    depends_on:
      nats:
        condition: service_started
      temporal:
        condition: service_started
      trade-execution-service:
        condition: service_healthy
      decision-governance-service:
        condition: service_healthy

  web:
    extends:
      file: docker-compose.v14-integration.yml
      service: web
    ports:
      - "127.0.0.1:${V15_WEB_HOST_PORT:?isolated V1.5 Web host port is required}:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/acceptance/v1/v1.5').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]

  nats:
    image: nats:2.10.29-alpine3.22@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    command: ["-js", "-m", "8222", "-sd", "/data/jetstream"]
    volumes:
      - nats-jetstream:/data/jetstream
    networks: [integration]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/temporal:1.8.3@sha256:cea463d98a8d6def4420f903ea5c3fcd0d85c8d10fbcc2770a50c12fff2eb26d
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    volumes:
      - temporal-dev-state:/home/temporal
    networks: [integration]

networks:
  integration:
    driver: bridge

volumes:
  v14-integration-postgres:
  nats-jetstream:
  temporal-dev-state:
  research-artifacts-v1:
