name: stockquant-v12

services:
  nats:
    restart: unless-stopped
    image: nats:2.10.29-alpine3.22@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    command: ["-js", "-m", "8222", "-sd", "/data/jetstream"]
    volumes:
      - nats-jetstream-v1:/data/jetstream
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    networks: [internal]

  temporal:
    restart: unless-stopped
    image: temporalio/temporal:1.8.3@sha256:cea463d98a8d6def4420f903ea5c3fcd0d85c8d10fbcc2770a50c12fff2eb26d
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    volumes:
      - temporal-dev-state-v1:/home/temporal
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    networks: [internal]

  postgres:
    restart: unless-stopped
    image: postgres:16.9-alpine@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${STOCKQUANT_POSTGRES_SUPERUSER_PASSWORD:-}"
      STOCKQUANT_DATABASE_PASSWORD_PLATFORM_API: "${STOCKQUANT_DATABASE_PASSWORD_PLATFORM_API:-}"
      STOCKQUANT_DATABASE_PASSWORD_PORTFOLIO_RISK: "${STOCKQUANT_DATABASE_PASSWORD_PORTFOLIO_RISK:-}"
      STOCKQUANT_DATABASE_PASSWORD_TRADE_EXECUTION: "${STOCKQUANT_DATABASE_PASSWORD_TRADE_EXECUTION:-}"
      STOCKQUANT_DATABASE_PASSWORD_TRADE_EXECUTION_TEST: "${STOCKQUANT_DATABASE_PASSWORD_TRADE_EXECUTION_TEST:-}"
      STOCKQUANT_DATABASE_PASSWORD_HISTORICAL_REPLAY: "${STOCKQUANT_DATABASE_PASSWORD_HISTORICAL_REPLAY:-}"
      STOCKQUANT_DATABASE_PASSWORD_DECISION_GOVERNANCE: "${STOCKQUANT_DATABASE_PASSWORD_DECISION_GOVERNANCE:-}"
      STOCKQUANT_DATABASE_PASSWORD_QUANT_RESEARCH: "${STOCKQUANT_DATABASE_PASSWORD_QUANT_RESEARCH:-}"
      STOCKQUANT_DATABASE_PASSWORD_RESEARCH_AUTOMATION: "${STOCKQUANT_DATABASE_PASSWORD_RESEARCH_AUTOMATION:-}"
      STOCKQUANT_DATABASE_PASSWORD_MARKET_DATA: "${STOCKQUANT_DATABASE_PASSWORD_MARKET_DATA:-}"
    volumes:
      - postgres-v11:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [internal, research-backplane]

  portfolio-risk-service:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/portfolio-risk-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3001
      STOCKQUANT_DATABASE_URL: "postgresql://portfolio_risk:${STOCKQUANT_DATABASE_PASSWORD_PORTFOLIO_RISK:-}@postgres:5432/portfolio_risk"
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: "${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:?distinct Portfolio Platform API token required}"
      STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION: "${STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION:?distinct Portfolio Trade Execution token required}"
      STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY: "${STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY:?distinct Portfolio Historical Replay token required}"
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  platform-api-service:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/platform-api-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3000
      STOCKQUANT_DATABASE_URL: "postgresql://platform_api:${STOCKQUANT_DATABASE_PASSWORD_PLATFORM_API:-}@postgres:5432/platform_api"
      STOCKQUANT_PORTFOLIO_API_URL: http://portfolio-risk-service:3001
      STOCKQUANT_MARKET_DATA_URL: http://market-data-service:3002
      STOCKQUANT_QUANT_RESEARCH_URL: http://quant-research-service:3003
      STOCKQUANT_RESEARCH_AUTOMATION_URL: http://research-automation-service:3008
      STOCKQUANT_V33_FIXTURE_RUNNER_IMAGE_DIGEST: ${STOCKQUANT_V33_FIXTURE_RUNNER_IMAGE_DIGEST:-}
      STOCKQUANT_TRADE_EXECUTION_URL: http://trade-execution-service:3005
      STOCKQUANT_HISTORICAL_REPLAY_WORKER_URL: http://historical-replay-worker:3006
      STOCKQUANT_PROJECT_ROOT: /workspace
      STOCKQUANT_ARTIFACT_CONTENT_ROOT: /var/lib/stockquant/research-artifacts
      STOCKQUANT_DC06_PROJECT_ID: "${STOCKQUANT_DC06_PROJECT_ID:-dc06-web}"
      STOCKQUANT_DC06_PROJECT_TOKEN: "${STOCKQUANT_DC06_PROJECT_TOKEN:-}"
      STOCKQUANT_LOCAL_DEVELOPMENT_USER: acceptance-owner-1
      STOCKQUANT_TEST_IDENTITY_HEADER_ENABLED: "true"
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
      STOCKQUANT_V11_RUN_STORAGE: ${STOCKQUANT_V11_RUN_STORAGE:-legacy}
      STOCKQUANT_V24_AUTO_START: "false"
      STOCKQUANT_V24_SAMPLING_INTERVAL_MINUTES: ${STOCKQUANT_V24_SAMPLING_INTERVAL_MINUTES:-30}
      STOCKQUANT_V24_QUOTE_SOURCE_USE_APPROVED: "false"
      STOCKQUANT_V24_QUOTE_SOURCE_AUTHORIZATION_REF: "${STOCKQUANT_V24_QUOTE_SOURCE_AUTHORIZATION_REF:-}"
      STOCKQUANT_V24_QUOTE_DATA_VERSION: "${STOCKQUANT_V24_QUOTE_DATA_VERSION:-}"
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: "${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:-}"
      STOCKQUANT_SERVICE_TOKEN_RESEARCH_AUTOMATION: "${STOCKQUANT_SERVICE_TOKEN_RESEARCH_AUTOMATION:-}"
      STOCKQUANT_NATS_URL: nats://nats:4222
      STOCKQUANT_NATS_SUBJECT: stockquant.v1.5.events
      STOCKQUANT_TEMPORAL_ADDRESS: temporal:7233
      STOCKQUANT_TEMPORAL_TASK_QUEUE: stockquant-v1-5
      STOCKQUANT_TEMPORAL_INJECT_FAILURE: "true"
    volumes:
      - research-artifacts-v1:/var/lib/stockquant/research-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      portfolio-risk-service:
        condition: service_healthy
      trade-execution-service:
        condition: service_healthy
      historical-replay-worker:
        condition: service_healthy
      research-automation-service:
        condition: service_healthy
      nats:
        condition: service_started
      temporal:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal, research-backplane]

  trade-execution-service:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/trade-execution-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3005
      STOCKQUANT_DATABASE_URL: "postgresql://trade_execution:${STOCKQUANT_DATABASE_PASSWORD_TRADE_EXECUTION:-}@postgres:5432/trade_execution"
      STOCKQUANT_PORTFOLIO_API_URL: http://portfolio-risk-service:3001
      STOCKQUANT_GOVERNANCE_URL: http://decision-governance-service:3007
      STOCKQUANT_QUANT_RESEARCH_URL: http://quant-research-service:3003
      STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION: "${STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION:-}"
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: "${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:-}"
      STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY: "${STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY:-}"
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
    depends_on:
      postgres:
        condition: service_healthy
      portfolio-risk-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3005/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  decision-governance-service:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/decision-governance-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3007
      STOCKQUANT_DATABASE_URL: "postgresql://decision_governance:${STOCKQUANT_DATABASE_PASSWORD_DECISION_GOVERNANCE:-}@postgres:5432/decision_governance"
      STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY: "${STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY:?distinct Governance replay token required}"
      STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION: "${STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION:?distinct Governance trade token required}"
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: "${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:?distinct Governance Platform API token required}"
      STOCKQUANT_SERVICE_TOKEN_DECISION_GOVERNANCE: "${STOCKQUANT_SERVICE_TOKEN_DECISION_GOVERNANCE:-}"
      STOCKQUANT_QUANT_RESEARCH_URL: http://quant-research-service:3003
    depends_on:
      postgres:
        condition: service_healthy
      quant-research-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3007/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  historical-replay-worker:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/historical-replay-worker/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3006
      STOCKQUANT_DATABASE_URL: "postgresql://historical_replay:${STOCKQUANT_DATABASE_PASSWORD_HISTORICAL_REPLAY:-}@postgres:5432/historical_replay"
      STOCKQUANT_PORTFOLIO_API_URL: http://portfolio-risk-service:3001
      STOCKQUANT_TRADE_EXECUTION_URL: http://trade-execution-service:3005
      STOCKQUANT_GOVERNANCE_URL: http://decision-governance-service:3007
      STOCKQUANT_QUANT_RESEARCH_URL: http://quant-research-service:3003
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: "${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:-}"
      STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY: "${STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      portfolio-risk-service:
        condition: service_healthy
      trade-execution-service:
        condition: service_healthy
      decision-governance-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3006/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  market-data-service:
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cpus: "1.0"
    mem_limit: 1g
    # Load local collection credentials for direct `docker compose` commands.
    # `.env.local` is ignored by Git; the service still fails closed when the
    # control token is absent, so this does not introduce a built-in secret.
    env_file:
      - ../../.env.local
    build:
      context: ../..
      dockerfile: services/market-data-service/Dockerfile
      args:
        STOCKQUANT_INSTALL_TDX: "${STOCKQUANT_INSTALL_TDX:-0}"
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3002
      STOCKQUANT_PROJECT_ROOT: /workspace
      STOCKQUANT_DATABASE_URL: "postgresql://market_data:${STOCKQUANT_DATABASE_PASSWORD_MARKET_DATA:-}@postgres:5432/market_data"
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: "${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:-}"
      STOCKQUANT_PROJECT_TOKENS: "${STOCKQUANT_PROJECT_TOKENS:-}"
      # Kept disabled until DC-00 freezes a real-source capability report and
      # DC-08A creates the approved subscription.  Enabling either is an
      # explicit operational action, never a side effect of `stack:up`.
      STOCKQUANT_COLLECTION_PROJECT_ID: stockquant-local
      STOCKQUANT_COLLECTION_DATA_VERSION: "${STOCKQUANT_COLLECTION_DATA_VERSION:-cn-5m-raw-v1}"
      STOCKQUANT_COLLECTION_SOURCE_USE_AUTHORIZED: "${STOCKQUANT_COLLECTION_SOURCE_USE_AUTHORIZED:-false}"
      STOCKQUANT_COLLECTION_SOURCE_AUTHORIZATION_REF: "${STOCKQUANT_COLLECTION_SOURCE_AUTHORIZATION_REF:-}"
      STOCKQUANT_COLLECTION_AUTHORIZED_SOURCE_IDS: "${STOCKQUANT_COLLECTION_AUTHORIZED_SOURCE_IDS:-}"
      STOCKQUANT_MARKET_RESEARCH_SOURCE_USE_AUTHORIZED: "${STOCKQUANT_MARKET_RESEARCH_SOURCE_USE_AUTHORIZED:-false}"
      STOCKQUANT_MARKET_RESEARCH_SOURCE_AUTHORIZATION_REF: "${STOCKQUANT_MARKET_RESEARCH_SOURCE_AUTHORIZATION_REF:-}"
      STOCKQUANT_MARKET_RESEARCH_DATA_VERSION: "${STOCKQUANT_MARKET_RESEARCH_DATA_VERSION:-}"
      STOCKQUANT_MARKET_RESEARCH_AUTHORIZED_SOURCE_IDS: "${STOCKQUANT_MARKET_RESEARCH_AUTHORIZED_SOURCE_IDS:-}"
      STOCKQUANT_MARKET_QUOTE_SOURCE_USE_AUTHORIZED: "${STOCKQUANT_MARKET_QUOTE_SOURCE_USE_AUTHORIZED:-false}"
      STOCKQUANT_MARKET_QUOTE_SOURCE_AUTHORIZATION_REF: "${STOCKQUANT_MARKET_QUOTE_SOURCE_AUTHORIZATION_REF:-}"
      STOCKQUANT_MARKET_QUOTE_DATA_VERSION: "${STOCKQUANT_MARKET_QUOTE_DATA_VERSION:-}"
      STOCKQUANT_MARKET_QUOTE_AUTHORIZED_SOURCE_IDS: "${STOCKQUANT_MARKET_QUOTE_AUTHORIZED_SOURCE_IDS:-}"
      STOCKQUANT_MARKET_NEWS_SOURCE_USE_AUTHORIZED: "${STOCKQUANT_MARKET_NEWS_SOURCE_USE_AUTHORIZED:-false}"
      STOCKQUANT_MARKET_NEWS_SOURCE_AUTHORIZATION_REF: "${STOCKQUANT_MARKET_NEWS_SOURCE_AUTHORIZATION_REF:-}"
      STOCKQUANT_MARKET_NEWS_DATA_VERSION: "${STOCKQUANT_MARKET_NEWS_DATA_VERSION:-}"
      STOCKQUANT_MARKET_NEWS_AUTHORIZED_SOURCE_IDS: "${STOCKQUANT_MARKET_NEWS_AUTHORIZED_SOURCE_IDS:-}"
      STOCKQUANT_COLLECTION_TIMEOUT_MS: "${STOCKQUANT_COLLECTION_TIMEOUT_MS:-180000}"
      STOCKQUANT_COLLECTION_SOURCE_TIMEOUT_SECONDS: "${STOCKQUANT_COLLECTION_SOURCE_TIMEOUT_SECONDS:-20}"
      STOCKQUANT_COLLECTION_SOURCE_MAX_ATTEMPTS: "${STOCKQUANT_COLLECTION_SOURCE_MAX_ATTEMPTS:-2}"
      STOCKQUANT_COLLECTION_SOURCE_BACKOFF_SECONDS: "${STOCKQUANT_COLLECTION_SOURCE_BACKOFF_SECONDS:-2}"
      STOCKQUANT_COLLECTION_SOURCE_BACKOFF_JITTER_SECONDS: "${STOCKQUANT_COLLECTION_SOURCE_BACKOFF_JITTER_SECONDS:-0.5}"
      STOCKQUANT_COLLECTION_SOURCE_RECOVERY_COOLDOWN_SECONDS: "${STOCKQUANT_COLLECTION_SOURCE_RECOVERY_COOLDOWN_SECONDS:-600}"
      STOCKQUANT_COLLECTION_BAOSTOCK_INTERVAL_SECONDS: "${STOCKQUANT_COLLECTION_BAOSTOCK_INTERVAL_SECONDS:-0.5}"
      STOCKQUANT_COLLECTION_BAOSTOCK_BATCH_SIZE: "${STOCKQUANT_COLLECTION_BAOSTOCK_BATCH_SIZE:-5}"
      STOCKQUANT_COLLECTION_TDX_INTERVAL_SECONDS: "${STOCKQUANT_COLLECTION_TDX_INTERVAL_SECONDS:-1.0}"
      STOCKQUANT_COLLECTION_TDX_BAR_COUNT: "${STOCKQUANT_COLLECTION_TDX_BAR_COUNT:-800}"
      STOCKQUANT_COLLECTION_SOURCES: "${STOCKQUANT_COLLECTION_SOURCES:-sina,baostock}"
    volumes:
      - market-data-health:/var/lib/stockquant
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  quant-research-service:
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    build:
      context: ../..
      dockerfile: services/quant-research-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3003
      QLIB_SOURCE_COMMIT: 5a84aaf1dc402232646ad2836dea33ff15886552
      QLIB_IMAGE: stockquant-v12-qlib-probe
      QLIB_WORKER_URL: http://qlib-worker:3004
      STOCKQUANT_RESEARCH_AUTOMATION_URL: http://research-automation-service:3008
      STOCKQUANT_DATABASE_URL: "postgresql://quant_research:${STOCKQUANT_DATABASE_PASSWORD_QUANT_RESEARCH:-}@postgres:5432/quant_research"
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: "${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:-}"
      STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY: "${STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY:-}"
      STOCKQUANT_SERVICE_TOKEN_RESEARCH_AUTOMATION: "${STOCKQUANT_SERVICE_TOKEN_RESEARCH_AUTOMATION:-}"
      STOCKQUANT_SERVICE_TOKEN_QUANT_VALIDATION_WORKER: "${STOCKQUANT_SERVICE_TOKEN_QUANT_VALIDATION_WORKER:-}"
      STOCKQUANT_SERVICE_TOKEN_QUANT_RESEARCH_SERVICE: "${STOCKQUANT_SERVICE_TOKEN_QUANT_RESEARCH_SERVICE:-}"
      STOCKQUANT_SERVICE_TOKEN_DECISION_GOVERNANCE: "${STOCKQUANT_SERVICE_TOKEN_DECISION_GOVERNANCE:-}"
    depends_on:
      postgres:
        condition: service_healthy
      market-data-service:
        condition: service_healthy
      qlib-worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal, research-backplane]

  research-automation-service:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/research-automation-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3008
      STOCKQUANT_DATABASE_URL: "postgresql://research_automation:${STOCKQUANT_DATABASE_PASSWORD_RESEARCH_AUTOMATION:-}@postgres:5432/research_automation"
      STOCKQUANT_PLATFORM_API_URL: http://platform-api-service:3000
      STOCKQUANT_QUANT_RESEARCH_URL: http://quant-research-service:3003
      STOCKQUANT_RESEARCH_ARTIFACT_ROOT: /var/lib/stockquant/research-artifacts
      STOCKQUANT_RUNNER_MODE: NOT_CONFIGURED
      STOCKQUANT_MODEL_GATEWAY_MODE: NOT_CONFIGURED
      STOCKQUANT_MODEL_PROVIDER_CALLS_AUTHORIZED: ${STOCKQUANT_MODEL_PROVIDER_CALLS_AUTHORIZED:-false}
      STOCKQUANT_RESEARCH_MAX_EXPERIMENT_BUDGET_CENTS: ${STOCKQUANT_RESEARCH_MAX_EXPERIMENT_BUDGET_CENTS:-1000}
      STOCKQUANT_RESEARCH_MAX_TEST_RUN_BUDGET_CENTS: ${STOCKQUANT_RESEARCH_MAX_TEST_RUN_BUDGET_CENTS:-1000}
      STOCKQUANT_RESEARCH_STAGE_BUDGET_CENTS: ${STOCKQUANT_RESEARCH_STAGE_BUDGET_CENTS:-3000}
      STOCKQUANT_RESEARCH_EMBEDDING_MODEL: "${STOCKQUANT_RESEARCH_EMBEDDING_MODEL:-litellm_proxy/Qwen/Qwen3-Embedding-4B}"
      STOCKQUANT_RESEARCH_EMBEDDING_DIMENSIONS: "${STOCKQUANT_RESEARCH_EMBEDDING_DIMENSIONS:-1024}"
      # Explicit secret pass-through. Values come from the ignored `.env.local`
      # when Compose is invoked with `--env-file .env.local`; no other local
      # environment variables are exposed to the research service.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      SILICONFLOW_API_KEY: "${SILICONFLOW_API_KEY:-}"
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: "${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:-}"
      STOCKQUANT_SERVICE_TOKEN_RESEARCH_AUTOMATION: "${STOCKQUANT_SERVICE_TOKEN_RESEARCH_AUTOMATION:-}"
      STOCKQUANT_SERVICE_TOKEN_RUNNER_HOST: "${STOCKQUANT_SERVICE_TOKEN_RUNNER_HOST:-}"
      STOCKQUANT_SERVICE_TOKEN_QUANT_VALIDATION_WORKER: "${STOCKQUANT_SERVICE_TOKEN_QUANT_VALIDATION_WORKER:-}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3008:3008"
    volumes:
      - research-artifacts-v1:/var/lib/stockquant/research-artifacts
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3008/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [research-backplane]

  research-egress-proxy:
    profiles: [research-egress]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/research-automation-service/Dockerfile
    command: ["node", "services/research-automation-service/dist/egress-proxy.js"]
    environment:
      STOCKQUANT_RESEARCH_EGRESS_PROXY_TOKEN: "${STOCKQUANT_RESEARCH_EGRESS_PROXY_TOKEN:-}"
      STOCKQUANT_RESEARCH_EGRESS_ALLOWED_HOSTS: api.deepseek.com,api.siliconflow.cn
      STOCKQUANT_RESEARCH_EGRESS_PROXY_PORT: "3128"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3128/').then(r=>process.exit(r.status===405?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [research-backplane, research-egress]

  qlib-worker:
    restart: unless-stopped
    platform: linux/amd64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    build:
      context: ../../services/quant-research-service
      dockerfile: qlib-worker.Dockerfile
    environment:
      QLIB_BIND_HOST: 0.0.0.0
      QLIB_PORT: 3004
      STOCKQUANT_SERVICE_TOKEN_QUANT_RESEARCH_SERVICE: "${STOCKQUANT_SERVICE_TOKEN_QUANT_RESEARCH_SERVICE:-}"
    ports:
      - "127.0.0.1:3004:3004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:3004/probe',headers={'authorization':'Bearer '+os.environ['STOCKQUANT_SERVICE_TOKEN_QUANT_RESEARCH_SERVICE'],'x-stockquant-service-id':'quant-research-service'}); urllib.request.urlopen(r)\""]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  web:
    restart: unless-stopped
    profiles: [web]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      STOCKQUANT_PLATFORM_API_URL: http://platform-api-service:3000
    depends_on:
      platform-api-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal]

networks:
  internal: {}
  research-backplane:
    internal: true
  research-egress: {}

volumes:
  nats-jetstream-v1:
  temporal-dev-state-v1:
  postgres-v11:
  market-data-health:
  research-artifacts-v1:
