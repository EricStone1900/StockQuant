name: stockquant-v12

services:
  nats:
    restart: unless-stopped
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    networks: [internal]

  temporal:
    restart: unless-stopped
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    networks: [internal]

  postgres:
    restart: unless-stopped
    image: postgres:16.9-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - postgres-v11:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [internal]

  portfolio-risk-service:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/portfolio-risk-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3001
      STOCKQUANT_DATABASE_URL: postgresql://portfolio_risk@postgres:5432/portfolio_risk
      STOCKQUANT_ALLOWED_SERVICE_ID: platform-api-service,trade-execution-service,historical-replay-worker
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  platform-api-service:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/platform-api-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3000
      STOCKQUANT_DATABASE_URL: postgresql://platform_api@postgres:5432/platform_api
      STOCKQUANT_PORTFOLIO_API_URL: http://portfolio-risk-service:3001
      STOCKQUANT_MARKET_DATA_URL: http://market-data-service:3002
      STOCKQUANT_QUANT_RESEARCH_URL: http://quant-research-service:3003
      STOCKQUANT_TRADE_EXECUTION_URL: http://trade-execution-service:3005
      STOCKQUANT_HISTORICAL_REPLAY_WORKER_URL: http://historical-replay-worker:3006
      STOCKQUANT_PROJECT_ROOT: /workspace
      STOCKQUANT_LOCAL_DEVELOPMENT_USER: acceptance-owner-1
      STOCKQUANT_TEST_IDENTITY_HEADER_ENABLED: "true"
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
      STOCKQUANT_V24_AUTO_START: "true"
      STOCKQUANT_NATS_URL: nats://nats:4222
      STOCKQUANT_NATS_SUBJECT: stockquant.v1.5.events
      STOCKQUANT_TEMPORAL_ADDRESS: temporal:7233
      STOCKQUANT_TEMPORAL_TASK_QUEUE: stockquant-v1-5
      STOCKQUANT_TEMPORAL_INJECT_FAILURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      portfolio-risk-service:
        condition: service_healthy
      trade-execution-service:
        condition: service_healthy
      historical-replay-worker:
        condition: service_healthy
      nats:
        condition: service_started
      temporal:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  trade-execution-service:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/trade-execution-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3005
      STOCKQUANT_DATABASE_URL: postgresql://trade_execution@postgres:5432/trade_execution
      STOCKQUANT_PORTFOLIO_API_URL: http://portfolio-risk-service:3001
      STOCKQUANT_GOVERNANCE_URL: http://decision-governance-service:3007
      STOCKQUANT_QUANT_RESEARCH_URL: http://quant-research-service:3003
      STOCKQUANT_ALLOWED_SERVICE_ID: platform-api-service
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
    depends_on:
      postgres:
        condition: service_healthy
      portfolio-risk-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3005/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  decision-governance-service:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/decision-governance-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3007
      STOCKQUANT_DATABASE_URL: postgresql://decision_governance@postgres:5432/decision_governance
      STOCKQUANT_ALLOWED_SERVICE_ID: historical-replay-worker
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3007/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  historical-replay-worker:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/historical-replay-worker/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3006
      STOCKQUANT_DATABASE_URL: postgresql://historical_replay@postgres:5432/historical_replay
      STOCKQUANT_PORTFOLIO_API_URL: http://portfolio-risk-service:3001
      STOCKQUANT_TRADE_EXECUTION_URL: http://trade-execution-service:3005
      STOCKQUANT_GOVERNANCE_URL: http://decision-governance-service:3007
      STOCKQUANT_QUANT_RESEARCH_URL: http://quant-research-service:3003
      STOCKQUANT_ALLOWED_SERVICE_ID: platform-api-service
    depends_on:
      postgres:
        condition: service_healthy
      portfolio-risk-service:
        condition: service_healthy
      trade-execution-service:
        condition: service_healthy
      decision-governance-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3006/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  market-data-service:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/market-data-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3002
      STOCKQUANT_PROJECT_ROOT: /workspace
      STOCKQUANT_DATABASE_URL: postgresql://market_data@postgres:5432/market_data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  quant-research-service:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/quant-research-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3003
      QLIB_SOURCE_COMMIT: qlib-0.9.6
      QLIB_IMAGE: stockquant-v12-qlib-probe
      QLIB_WORKER_URL: http://qlib-worker:3004
      STOCKQUANT_DATABASE_URL: postgresql://quant_research@postgres:5432/quant_research
    depends_on:
      postgres:
        condition: service_healthy
      market-data-service:
        condition: service_healthy
      qlib-worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  qlib-worker:
    restart: unless-stopped
    platform: linux/amd64
    build:
      context: ../../services/quant-research-service
      dockerfile: qlib-worker.Dockerfile
    environment:
      QLIB_BIND_HOST: 0.0.0.0
      QLIB_PORT: 3004
    ports:
      - "127.0.0.1:3004:3004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3004/probe')\""]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  web:
    restart: unless-stopped
    profiles: [web]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      STOCKQUANT_PLATFORM_API_URL: http://platform-api-service:3000
    depends_on:
      platform-api-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal]

networks:
  internal: {}

volumes:
  postgres-v11:
