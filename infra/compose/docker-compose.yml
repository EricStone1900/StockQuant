name: stockquant-v12

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - postgres-v11:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [internal]

  portfolio-risk-service:
    build:
      context: ../..
      dockerfile: services/portfolio-risk-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3001
      STOCKQUANT_DATABASE_URL: postgresql://portfolio_risk@postgres:5432/portfolio_risk
      STOCKQUANT_ALLOWED_SERVICE_ID: platform-api-service
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  platform-api-service:
    build:
      context: ../..
      dockerfile: services/platform-api-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3000
      STOCKQUANT_DATABASE_URL: postgresql://platform_api@postgres:5432/platform_api
      STOCKQUANT_PORTFOLIO_API_URL: http://portfolio-risk-service:3001
      STOCKQUANT_MARKET_DATA_URL: http://market-data-service:3002
      STOCKQUANT_QUANT_RESEARCH_URL: http://quant-research-service:3003
      STOCKQUANT_LOCAL_DEVELOPMENT_USER: acceptance-owner-1
      STOCKQUANT_TEST_IDENTITY_HEADER_ENABLED: "true"
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
    depends_on:
      postgres:
        condition: service_healthy
      portfolio-risk-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  market-data-service:
    build:
      context: ../..
      dockerfile: services/market-data-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3002
      STOCKQUANT_PROJECT_ROOT: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  quant-research-service:
    build:
      context: ../..
      dockerfile: services/quant-research-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3003
      QLIB_SOURCE_COMMIT: qlib-0.9.6
      QLIB_IMAGE: stockquant-v12-qlib-probe
      QLIB_WORKER_URL: http://qlib-worker:3004
    depends_on:
      market-data-service:
        condition: service_healthy
      qlib-worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  qlib-worker:
    platform: linux/amd64
    build:
      context: ../../services/quant-research-service
      dockerfile: qlib-worker.Dockerfile
    environment:
      QLIB_BIND_HOST: 0.0.0.0
      QLIB_PORT: 3004
    ports:
      - "127.0.0.1:3004:3004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3004/probe')\""]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  web:
    profiles: [web]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      STOCKQUANT_PLATFORM_API_URL: http://platform-api-service:3000
    depends_on:
      platform-api-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal]

networks:
  internal: {}

volumes:
  postgres-v11:
