services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      STOCKQUANT_DATABASE_PASSWORD_PLATFORM_API: ${STOCKQUANT_DATABASE_PASSWORD_PLATFORM_API:?isolated test password is required}
      STOCKQUANT_DATABASE_PASSWORD_PORTFOLIO_RISK: ${STOCKQUANT_DATABASE_PASSWORD_PORTFOLIO_RISK:?isolated test password is required}
      STOCKQUANT_DATABASE_PASSWORD_TRADE_EXECUTION: ${STOCKQUANT_DATABASE_PASSWORD_TRADE_EXECUTION:?isolated test password is required}
      STOCKQUANT_DATABASE_PASSWORD_TRADE_EXECUTION_TEST: ${STOCKQUANT_DATABASE_PASSWORD_TRADE_EXECUTION_TEST:?isolated test password is required}
      STOCKQUANT_DATABASE_PASSWORD_HISTORICAL_REPLAY: ${STOCKQUANT_DATABASE_PASSWORD_HISTORICAL_REPLAY:?isolated test password is required}
      STOCKQUANT_DATABASE_PASSWORD_DECISION_GOVERNANCE: ${STOCKQUANT_DATABASE_PASSWORD_DECISION_GOVERNANCE:?isolated test password is required}
      STOCKQUANT_DATABASE_PASSWORD_QUANT_RESEARCH: ${STOCKQUANT_DATABASE_PASSWORD_QUANT_RESEARCH:?isolated test password is required}
      STOCKQUANT_DATABASE_PASSWORD_RESEARCH_AUTOMATION: ${STOCKQUANT_DATABASE_PASSWORD_RESEARCH_AUTOMATION:?isolated test password is required}
      STOCKQUANT_DATABASE_PASSWORD_MARKET_DATA: ${STOCKQUANT_DATABASE_PASSWORD_MARKET_DATA:?isolated test password is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_PASSWORD: ${STOCKQUANT_POSTGRES_SUPERUSER_PASSWORD:?isolated PostgreSQL superuser password is required}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - v13-integration-postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [integration]

  portfolio-risk-service:
    build:
      context: ../..
      dockerfile: services/portfolio-risk-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3001
      STOCKQUANT_DATABASE_URL: postgresql://portfolio_risk:${STOCKQUANT_DATABASE_PASSWORD_PORTFOLIO_RISK:?isolated role password is required}@postgres:5432/portfolio_risk
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: ${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:?isolated service token is required}
      STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION: ${STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION:?isolated service token is required}
      STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY: ${STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY:?isolated service token is required}
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [integration]

  market-data-service:
    build:
      context: ../..
      dockerfile: services/market-data-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3002
      STOCKQUANT_PROJECT_ROOT: /workspace
      STOCKQUANT_DATABASE_URL: postgresql://market_data:${STOCKQUANT_DATABASE_PASSWORD_MARKET_DATA:?isolated role password is required}@postgres:5432/market_data
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: ${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:?isolated service token is required}
      STOCKQUANT_COLLECTION_EXECUTOR: "0"
      STOCKQUANT_COLLECTION_SOURCE_USE_AUTHORIZED: "false"
      STOCKQUANT_MARKET_RESEARCH_SOURCE_USE_AUTHORIZED: "false"
      STOCKQUANT_MARKET_QUOTE_SOURCE_USE_AUTHORIZED: "false"
      STOCKQUANT_MARKET_NEWS_SOURCE_USE_AUTHORIZED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [integration]

  platform-api-service:
    build:
      context: ../..
      dockerfile: services/platform-api-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3000
      STOCKQUANT_DATABASE_URL: postgresql://platform_api:${STOCKQUANT_DATABASE_PASSWORD_PLATFORM_API:?isolated role password is required}@postgres:5432/platform_api
      STOCKQUANT_PORTFOLIO_API_URL: http://portfolio-risk-service:3001
      STOCKQUANT_GOVERNANCE_URL: http://decision-governance-service:3007
      STOCKQUANT_TRADE_EXECUTION_URL: http://trade-execution-service:3005
      STOCKQUANT_MARKET_DATA_URL: http://market-data-service:3002
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: ${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:?isolated service token is required}
      STOCKQUANT_LOCAL_DEVELOPMENT_USER: acceptance-owner-1
      STOCKQUANT_TEST_IDENTITY_HEADER_ENABLED: "true"
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
      STOCKQUANT_V11_RUN_STORAGE: stage
      STOCKQUANT_V24_AUTO_START: "false"
    ports:
      - "127.0.0.1:${V11_HOST_PORT:-33000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      portfolio-risk-service:
        condition: service_healthy
      decision-governance-service:
        condition: service_healthy
      trade-execution-service:
        condition: service_healthy
      market-data-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [integration]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      STOCKQUANT_PLATFORM_API_URL: http://platform-api-service:3000
    depends_on:
      platform-api-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${V13_WEB_HOST_PORT:?isolated V1.3 Web port is required}:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/acceptance/v1/v1.3').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [integration]

  trade-execution-service:
    build:
      context: ../..
      dockerfile: services/trade-execution-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3005
      STOCKQUANT_DATABASE_URL: postgresql://trade_execution:${STOCKQUANT_DATABASE_PASSWORD_TRADE_EXECUTION:?isolated role password is required}@postgres:5432/trade_execution
      STOCKQUANT_PORTFOLIO_API_URL: http://portfolio-risk-service:3001
      STOCKQUANT_GOVERNANCE_URL: http://decision-governance-service:3007
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: ${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:?isolated service token is required}
      STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION: ${STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION:?isolated service token is required}
      STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY: ${STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY:?isolated service token is required}
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
      STOCKQUANT_V13_TEST_FAULTS_ENABLED: "true"
      STOCKQUANT_V13_TEST_MANUAL_MULTILEG_RESTART_DELAY_MS: ${STOCKQUANT_V13_TEST_MANUAL_MULTILEG_RESTART_DELAY_MS:-0}
      STOCKQUANT_V13_TEST_FEE_CORRECTION_FAILURE_ENABLED: ${STOCKQUANT_V13_TEST_FEE_CORRECTION_FAILURE_ENABLED:-false}
    ports:
      - "127.0.0.1:${V13_TRADE_HOST_PORT:?isolated V1.3 Trade port is required}:3005"
    depends_on:
      postgres:
        condition: service_healthy
      portfolio-risk-service:
        condition: service_healthy
      decision-governance-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3005/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [integration]

  decision-governance-service:
    build:
      context: ../..
      dockerfile: services/decision-governance-service/Dockerfile
    environment:
      STOCKQUANT_BIND_HOST: 0.0.0.0
      STOCKQUANT_PORT: 3007
      STOCKQUANT_DATABASE_URL: postgresql://decision_governance:${STOCKQUANT_DATABASE_PASSWORD_DECISION_GOVERNANCE:?isolated role password is required}@postgres:5432/decision_governance
      STOCKQUANT_SERVICE_TOKEN_PLATFORM_API: ${STOCKQUANT_SERVICE_TOKEN_PLATFORM_API:?isolated service token is required}
      STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION: ${STOCKQUANT_SERVICE_TOKEN_TRADE_EXECUTION:?isolated service token is required}
      STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY: ${STOCKQUANT_SERVICE_TOKEN_HISTORICAL_REPLAY:?isolated service token is required}
      STOCKQUANT_LIVE_TRADING_ENABLED: "false"
      STOCKQUANT_BROKER_MODE: FAKE
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3007/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [integration]

networks:
  integration:
    driver: bridge

volumes:
  v13-integration-postgres:
