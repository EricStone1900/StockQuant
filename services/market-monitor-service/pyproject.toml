[project]
name = "stockquant-market-monitor-service"
version = "0.1.0"
description = "Deterministic quote coverage and freshness evaluation"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.128.8",
    "psycopg[binary]==3.2.12",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
