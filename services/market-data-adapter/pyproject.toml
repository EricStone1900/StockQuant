[project]
name = "stockquant-market-data-adapter"
version = "0.1.0"
description = "Bounded read-only BaoStock/Sina/Eastmoney minute data adapters"
requires-python = ">=3.9"
dependencies = ["baostock==0.9.3", "requests==2.32.5"]

[project.optional-dependencies]
tdx = ["easy-tdx @ git+https://github.com/clong365/easy_tdx.git@4820b4a0496899ece0b8ca4d7f4d66a5159da7f8 ; python_version >= '3.10'"]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
    "types-requests>=2.32,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
