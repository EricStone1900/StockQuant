[project]
name = "stockquant-market-data-adapter"
version = "0.1.0"
description = "Bounded read-only BaoStock/Sina minute data adapters"
requires-python = ">=3.9"
dependencies = ["baostock==0.8.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
